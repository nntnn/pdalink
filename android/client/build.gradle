plugins {
    id "com.android.application"
}

android {
    namespace "dev.pdalink.client"
    compileSdk 35

    defaultConfig {
        applicationId "dev.pdalink.client"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDir "../shared/src/main/java"
        main.jniLibs.srcDir(System.getenv("PDALINK_TUN2PROXY_LIBS") ?: rootProject.file("../.tools/android-deps/tun2proxy-0.8.2/tun2proxy-android-libs"))
    }
}

dependencies {
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.google.zxing:core:3.5.3"
    testImplementation "junit:junit:4.13.2"
}
